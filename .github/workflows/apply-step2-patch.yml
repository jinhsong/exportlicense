name: Apply Step 2 UI patch

on:
  push:
    branches:
      - codex/remove-unknown-item-option

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-unknown-item-option
      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    <p class="lead">먼저 통제번호(ECCN)를 알고 계신지 선택하세요. 통제번호는 전략물자 <b>‘판정’</b>을 통해 확인합니다.</p>',
                  '    <p class="lead">모델명, 품목명, 통제번호(ECCN)를 입력하세요. 통제번호는 전략물자 <b>‘판정’</b>을 통해 확인합니다.</p>',
              ),
              (
                  '      <button class="opt-card" data-know="no"><h4>모르겠어요 · 전략물자인지 모름</h4><p>통제번호가 없거나 전략물자 해당 여부가 불확실하면 판정 방법을 안내합니다.</p></button>\n',
                  '',
              ),
              (
                  '통제번호를 알아야 허가 신청을 진행할 수 있으며, 이 화면 2단계에서 입력합니다. 모르면 2단계의 ‘모르겠어요’를 선택해 판정 방법 안내를 받으세요.',
                  '통제번호를 알아야 허가 신청을 진행할 수 있으며, 이 화면 2단계에서 입력합니다. 모르면 판정 결과를 먼저 확인한 뒤 통제번호를 입력하세요.',
              ),
          ]

          missing = []
          for old, new in replacements:
              if old not in text:
                  missing.append(old)
              text = text.replace(old, new)

          if missing:
              raise SystemExit('Expected text not found: ' + repr(missing))

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-step2-patch.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-step2-patch.yml
          git commit -m "Remove unknown item option from step 2"
          git push
