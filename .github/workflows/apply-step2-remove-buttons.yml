name: Apply Step 2 button removal

on:
  push:
    branches:
      - codex/remove-unknown-item-option

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-unknown-item-option
      - name: Remove Step 2 selection buttons
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def remove_between(text, start, end, keep_end=True):
              s = text.find(start)
              if s == -1:
                  raise SystemExit(f'start marker not found: {start!r}')
              e = text.find(end, s)
              if e == -1:
                  raise SystemExit(f'end marker not found after {start!r}: {end!r}')
              return text[:s] + (end if keep_end else '') + text[e + (len(end) if keep_end else 0):]

          # Remove visible choice card area in Step 2.
          text = remove_between(
              text,
              '\n    <div class="opt-grid" id="knowSel">',
              '\n\n    <div id="knowYes" style="margin-top:20px">',
              keep_end=True,
          )

          # Remove hidden unknown/판정 안내 block and its button.
          text = remove_between(
              text,
              '\n\n    <div id="knowNo" class="hidden" style="margin-top:20px">',
              '\n\n    <div class="nav-row"><button class="btn" id="back2">← 이전</button><button class="btn primary" id="next2" disabled>다음 →</button></div>',
              keep_end=True,
          )

          # Step 2 always shows item inputs now; no know-mode toggle needed.
          text = text.replace('  setKnow("yes");\n', '')

          start = 'function setKnow(mode){\n'
          end = '$("#addItem").addEventListener("click",()=>{ syncItemsFromDom(); state.items.push(makeItem()); renderItems(); updateNext2(); });\n'
          s = text.find(start)
          if s == -1:
              raise SystemExit('setKnow function not found')
          e = text.find(end, s)
          if e == -1:
              raise SystemExit('addItem listener marker not found')
          text = text[:s] + end + text[e + len(end):]

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-step2-remove-buttons.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-step2-remove-buttons.yml
          git commit -m "Remove step 2 choice buttons entirely"
          git push
